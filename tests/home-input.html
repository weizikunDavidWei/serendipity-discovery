<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>首页真实输入观测</title><style>body{margin:0}iframe{position:absolute;inset:0;border:0;width:100%;height:100%}#proof{position:fixed;left:20px;top:100px;z-index:5;pointer-events:none;font:12px system-ui;background:#fff;color:#000;padding:8px;white-space:pre-wrap}</style><iframe src="../" title="实际生产首页"></iframe><output id="proof">拖动任意主题后松手；此页只观察真实首页的渲染位移，不修改其物理状态。</output><script>
const frame=document.querySelector('iframe'),proof=document.querySelector('#proof');let record;
frame.onload=()=>{const d=frame.contentDocument;d.addEventListener('pointerup',e=>{const b=e.target.closest('.orb');if(!b||!e.isTrusted)return;const r=b.getBoundingClientRect();record={b,x:r.x,y:r.y,at:performance.now(),max:0};});};
function sample(){if(record){const r=record.b.getBoundingClientRect();record.max=Math.max(record.max,Math.hypot(r.x-record.x,r.y-record.y));const elapsed=performance.now()-record.at;if(elapsed<2500)proof.textContent=(record.max>25?'PASS · 首页松手后持续运动':'观测中')+'\n真实 pointerup 后 '+elapsed.toFixed(0)+'ms，最大位移 '+record.max.toFixed(1)+'px；未操纵世界状态或时钟。';}requestAnimationFrame(sample);}requestAnimationFrame(sample);
</script></html>
