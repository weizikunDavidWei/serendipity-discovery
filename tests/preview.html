<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>场景视觉核查</title><style>body{margin:16px;font:13px system-ui;background:#ddd;color:#000}button,select{padding:8px;margin:4px}iframe{display:block;border:0;margin-top:12px;background:#fff}</style><label>视口 <select id="size"><option value="390,844">390 × 844 手机</option><option value="1440,900">1440 × 900 桌面</option><option value="844,390">844 × 390 横屏</option></select></label><label>数量 <select id="count"><option>5</option><option>7</option><option>9</option></select></label><label>颜色 <select id="color"><option value="light">浅色</option><option value="dark">深色</option></select></label><button id="load">装载真实首页</button><iframe id="scene" title="真实首页视觉核查"></iframe><script type="module">
const $=s=>document.querySelector(s);async function load(){const [width,height]=$('#size').value.split(',').map(Number),count=Number($('#count').value);const f=$('#scene');f.style.width=width+'px';f.style.height=height+'px';const html=await(await fetch('../index.html')).text();const boot='<scr'+'ipt>const cryptoRandom=crypto.getRandomValues.bind(crypto);let first=true;crypto.getRandomValues=a=>{cryptoRandom(a);if(first){first=false;a[0]='+String(count-5)+';}return a;};</scr'+'ipt>';f.onload=()=>{const w=f.contentWindow;for(const sheet of w.document.styleSheets)for(const rule of sheet.cssRules)if(rule instanceof w.CSSMediaRule&&rule.conditionText.includes('prefers-color-scheme'))rule.media.mediaText=$('#color').value==='dark'?'all':'not all';};f.srcdoc=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">'+boot);}$('#load').onclick=load;load();
</script></html>
